name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1B4FE0&color_dots[0]=161b22&color_dots[1]=0e1634&color_dots[2]=1a3a7a&color_dots[3]=1B4FE0&color_dots[4]=7aa8f5
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#1B4FE0&color_dots[0]=161b22&color_dots[1]=0e1634&color_dots[2]=1a3a7a&color_dots[3]=1B4FE0&color_dots[4]=7aa8f5

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
